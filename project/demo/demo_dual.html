<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2.4GHz·5GHz 비교</title>
<!--
  2026-10-06 2.4GHz·5GHz 비교 화면. 기존 demo.html(한 대역 화면)은 그대로 두고 따로 만든 파일.
  실시간: 2.4GHz 서버(demo_server.py --band 24g --port 8000 --s21 s21g --s26 s26g)의 /dual 로 열면
          같은 서버(:8000) + 옆 5GHz 서버(:8001, --band 5g --port 8001)의 SSE를 같이 받는다. 주소 ?p5=8001 처럼 포트 변경 가능.
          폰이 어느 대역에 있는지는 4초마다 두 서버 /check 로 판별, 부하 버튼은 그 대역 서버 /load 로 (60초 뒤 자동 정지).
          부하 받는 쪽은 유선 Pi(run_dual_demo.sh 기본, 5211/5212) — 노트북으로 받으면 폰을 5GHz로 옮겨도 AP→노트북 구간이
          노트북 대역(2.4GHz)에 남는데 Opal 점유율엔 안 잡혀 비교가 섞인다. 화면의 "폰 n대"는 노트북을 뺀 폰 수.
  연습: 파일로 열거나 주소 끝 #sim(가짜 데이터) · #auto(시연 흐름 자동 재생).
  목적: 서버 두 개(2.4GHz :8000 / 5GHz :8001)를 한 화면에 나란히 보여 주는 비교 화면의 배치·크기 확인.
  노트북 1536×864(1920×1080, 배율 125%)·프로젝터 1920×1080에서 스크롤 없이 한 화면에 들어가도록 잡았다.
  디자인은 demo.html(taste)과 같은 글꼴·색·모양 규칙. 단계 4색은 상태에만, 조작은 잉크색 하나.
  가짜 점수는 10-06 리허설 실측에 맞춘 대략값: 2.4GHz 폰당 20M≈경고~혼잡, 30M≈혼잡~심각, 40M≈심각 /
  5GHz 40MHz 폰당 30M≈정상, 40M≈경고. 연결 단계에서 SSE 두 개(:8000·:8001)로 바꿀 예정.
-->
<style>
@font-face{font-family:"Pretendard Variable";src:url(assets_taste/PretendardVariable.woff2) format("woff2-variations");
  font-weight:45 920;font-display:swap}
@font-face{font-family:"Phosphor";src:url(assets_taste/Phosphor.woff2) format("woff2");font-display:block}
@font-face{font-family:"Phosphor-Bold";src:url(assets_taste/Phosphor-Bold.woff2) format("woff2");font-display:block}
.ic,.ic-b{font-style:normal;font-weight:normal;line-height:1;speak:never;-webkit-font-smoothing:antialiased}
.ic{font-family:"Phosphor"}.ic-b{font-family:"Phosphor-Bold"}
.i-wifi::before{content:"\e4ea"}.i-half::before{content:"\e18c"}.i-phone::before{content:"\e1e0"}
.i-swap::before{content:"\e0a0"}.i-info::before{content:"\e2ce"}

:root{
  --bg:#f2f3f5; --surface:#ffffff; --line:#e1e3e8;
  --ink:#16181d; --ink-2:#4a4f5c; --ink-3:#6b7180; --on-ink:#f7f8fa;
  --l0:#23935f; --l1:#c08a00; --l2:#dd6418; --l3:#d23338;
  --l0-t:#17724a; --l1-t:#8a6300; --l2-t:#b04c0e; --l3-t:#b0242a;
  --font:"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1); --gap:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --surface:#1a1d23; --line:#2a2e36;
    --ink:#eef0f3; --ink-2:#b4b9c4; --ink-3:#8c92a0; --on-ink:#15171b;
    --l0:#3fbf85; --l1:#e2b33a; --l2:#f08a47; --l3:#f2625f;
    --l0-t:#5fd49c; --l1-t:#f0c65a; --l2-t:#f6a06a; --l3-t:#ff8a85; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1a1d23; --line:#2a2e36;
  --ink:#eef0f3; --ink-2:#b4b9c4; --ink-3:#8c92a0; --on-ink:#15171b;
  --l0:#3fbf85; --l1:#e2b33a; --l2:#f08a47; --l3:#f2625f;
  --l0-t:#5fd49c; --l1-t:#f0c65a; --l2-t:#f6a06a; --l3-t:#ff8a85; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* 한 화면: 상단 바 / (2.4GHz | 화살표 | 5GHz) / 기기 줄 */
.app{max-width:1600px;margin:0 auto;padding:0 20px 18px;display:grid;gap:var(--gap);grid-template-rows:auto minmax(0,1fr) auto}
@media (min-width:901px) and (min-height:600px){ .app{height:100dvh} }
.panel{background:var(--surface);border-radius:20px;min-width:0;min-height:0}

.top{display:flex;align-items:center;gap:14px;height:56px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .ic{font-size:26px}
.brand-t{display:flex;flex-direction:column;line-height:1.2}
.brand-t small{font-size:13px;font-weight:500;color:var(--ink-2)}
.chip{font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);white-space:nowrap}
.team{margin-left:auto;font-size:14px;color:var(--ink-2);text-align:right}
.team b{color:var(--ink)}
.icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;font-size:18px;flex:none}

main{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:0;min-height:0}

/* 대역 칸 */
.band{--lv:var(--l0);--lv-t:var(--l0-t);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px;padding:18px 22px 16px;
  background:color-mix(in oklab,var(--lv) 12%,var(--surface));transition:background-color .6s var(--ease)}
.band[data-lv="1"]{--lv:var(--l1);--lv-t:var(--l1-t)}
.band[data-lv="2"]{--lv:var(--l2);--lv-t:var(--l2-t)}
.band[data-lv="3"]{--lv:var(--l3);--lv-t:var(--l3-t)}
.band[data-idle="1"]{background:var(--surface)}
.b-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.b-name{display:flex;align-items:baseline;gap:10px}
.b-name b{font-size:clamp(24px,3.4vh,32px);letter-spacing:-.03em}
.b-name span{font-size:14px;color:var(--ink-2)}
.b-cnt{font-size:14px;color:var(--ink-2);white-space:nowrap}
.b-cnt b{color:var(--ink)}
.b-state{display:flex;flex-direction:column;gap:6px}
.b-state .lead{font-size:15px;color:var(--ink-2);margin:0}
.b-state h2{font-size:clamp(34px,min(4.2vw,7vh),64px);line-height:1.06;letter-spacing:-.035em;font-weight:800;margin:0;
  color:var(--lv-t);transition:color .6s var(--ease)}
.band[data-idle="1"] .b-state h2{color:var(--ink-3)}
.b-state .desc{font-size:clamp(15px,2vh,18px);margin:0;color:var(--ink-2);min-height:1.45em}
.pills{display:flex;gap:8px;flex-wrap:wrap;min-height:38px}
.pill{display:none;align-items:center;gap:8px;font-weight:700;width:fit-content;border-radius:999px;padding:7px 15px;font-size:15px}
.pill.alert{color:var(--on-ink);background:var(--l3)}
.band[data-switch="1"] .pill.alert{display:inline-flex}
.pill.ok{color:var(--l0-t);border:1.5px solid color-mix(in oklab,var(--l0) 55%,transparent)}
.band[data-after="1"] .pill.ok{display:inline-flex}

.chart{position:relative;min-height:120px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.b-foot{display:grid;grid-template-columns:minmax(0,1.3fr) auto auto;gap:18px;align-items:end;
  padding-top:12px;border-top:1px solid color-mix(in oklab,var(--lv) 25%,transparent)}
.scale .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scale .seg span{height:10px;border-radius:999px;opacity:.22;transition:opacity .4s}
.scale .seg span:nth-child(1){background:var(--l0)}.scale .seg span:nth-child(2){background:var(--l1)}
.scale .seg span:nth-child(3){background:var(--l2)}.scale .seg span:nth-child(4){background:var(--l3)}
.scale .seg span.on{opacity:1}
.scale .names{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;font-size:13px;color:var(--ink-3)}
.scale .names span.on{color:var(--ink);font-weight:700}
.stat{text-align:right}
.stat .k{font-size:13px;color:var(--ink-2);display:block}
.stat .v{font-size:clamp(26px,3.8vh,36px);font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:2px;letter-spacing:0}

/* 가운데 화살표: 2.4GHz 전환 경보 때만 켜짐 */
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-3)}
.mid .ic-b{font-size:30px;transition:color .3s,transform .3s var(--ease)}
.mid small{font-size:12px;writing-mode:vertical-rl;letter-spacing:.08em;opacity:0;transition:opacity .3s}
body[data-move="1"] .mid .ic-b{color:var(--l3);transform:scale(1.15)}
body[data-move="1"] .mid small{opacity:1;color:var(--l3-t);font-weight:700}

/* 기기 줄 */
.devs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:var(--gap)}
.dev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 18px}
.dev-name{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;white-space:nowrap}
.dev-name .ic{font-size:22px}
.where{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;border:1.5px solid var(--line);color:var(--ink-2);white-space:nowrap}
.where[data-b="5"]{border-color:var(--ink);color:var(--ink)}
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:0}
.rate{min-width:0;padding:0;height:clamp(42px,5.6vh,52px);border-radius:999px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;
  font-size:19px;font-weight:800;letter-spacing:-.02em;touch-action:manipulation;transition:transform .15s,background-color .2s,color .2s,border-color .2s}
.rate small{font-size:12px;font-weight:600;margin-left:1px;opacity:.7}
.rate:hover{border-color:var(--ink-3)}
.rate:active{transform:scale(.97)}
.rate[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.mv{height:42px;border-radius:999px;border:1.5px dashed var(--ink-3);background:transparent;cursor:pointer;padding:0 14px;
  font-size:14px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.scen{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px 16px;min-width:190px}
.scen button{height:40px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);
  font-weight:700;cursor:pointer;padding:0 16px}
.scen small{font-size:12px;color:var(--ink-3);text-align:center}
body[data-live="1"] .mv{display:none}
.scen .hint{font-size:13px;color:var(--ink-2);text-align:left;line-height:1.5}
.rate:disabled{opacity:.35;cursor:not-allowed}
.where[data-b="none"]{border-style:dashed;color:var(--ink-3)}

/* 정답 비교 서랍 (2026-10-08, A안: 정답 = 라벨 공식의 점유율 축) */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(440px,88vw);background:var(--surface);
  box-shadow:-12px 0 32px color-mix(in oklab,var(--ink) 0%,transparent);transform:translateX(100%);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
body[data-drawer="1"] .drawer{transform:none;box-shadow:-12px 0 32px color-mix(in oklab,var(--ink) 18%,transparent)}
.dr-body{height:100%;overflow:auto;display:flex;flex-direction:column;padding:18px 20px 16px;gap:14px}
/* 날개(손잡이): 서랍 왼쪽 가장자리에 붙어 같이 움직인다. 닫혀 있으면 화면 오른쪽 끝에 날개만 보인다 */
.wing{position:absolute;top:50%;right:100%;transform:translateY(-50%);width:40px;height:150px;border:0;cursor:pointer;
  border-radius:16px 0 0 16px;background:var(--ink);color:var(--on-ink);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;padding:0;box-shadow:-6px 4px 16px color-mix(in oklab,var(--ink) 22%,transparent);
  transition:width .25s var(--ease),background-color .2s}
.wing:hover{width:46px}
.wing .w-t{writing-mode:vertical-rl;font-weight:700;font-size:14px;letter-spacing:.08em}
.wing .w-a{font-size:16px;line-height:1;transition:transform .5s var(--ease)}
body[data-drawer="1"] .wing .w-a{transform:rotate(180deg)}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dr-head h3{margin:0;font-size:20px;letter-spacing:-.02em}
.dr-note{font-size:13px;color:var(--ink-2);margin:0;line-height:1.5}
.dr-band{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dr-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dr-top b{font-size:18px}
.dr-acc{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dr-acc small{font-size:13px;color:var(--ink-3);font-weight:600;margin-left:3px}
.dr-sub{font-size:13px;color:var(--ink-2);display:flex;gap:4px 14px;flex-wrap:wrap}
.strip{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.strip canvas{position:static;width:100%;height:16px;border-radius:4px}
.dr-err{font-size:13px;color:var(--ink-2);min-height:1.4em}
.dr-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.dr-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

@media (max-width:1400px){
  .dev{gap:10px;padding:12px 14px}
  .rates{gap:6px}
  .rate{font-size:17px}
  .where{font-size:12px;padding:2px 8px}
  .mv{padding:0 10px;font-size:13px}
  .scen{min-width:150px;padding:10px 12px}
  .scen button{padding:0 10px;font-size:14px}
}
@media (max-width:900px){
  .app{padding:0 16px 24px;height:auto}
  main{grid-template-columns:1fr;gap:var(--gap)}
  .mid{flex-direction:row;padding:4px 0}.mid .ic-b{transform:rotate(90deg)}.mid small{writing-mode:horizontal-tb}
  .chart{height:200px;flex:none}
  .devs{grid-template-columns:1fr}
  .dev{grid-template-columns:1fr;gap:10px}
  .top{height:auto;min-height:56px;flex-wrap:wrap;padding:10px 0;gap:8px 12px}
  .team{order:3;width:100%;margin-left:0;text-align:left;font-size:13px}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i class="ic i-wifi" aria-hidden="true"></i>
      <div class="brand-t">와이파이 혼잡 비교<small>같은 공유기, 같은 양의 데이터 — 2.4GHz와 5GHz는 어떻게 다를까요?</small></div>
    </div>
    <span class="chip" id="modeChip">연결 중…</span>
    <div class="team">한밭대학교 캡스톤디자인 · 팀 <b>자원할당해조</b></div>
    <button class="icon-btn" id="themeBtn" aria-label="밝게/어둡게 바꾸기"><i class="ic i-half" aria-hidden="true"></i></button>
  </header>

  <main>
    <section class="panel band" id="b24" aria-live="polite"></section>
    <div class="mid" aria-hidden="true"><i class="ic-b i-swap"></i><small>5GHz로 옮기기</small></div>
    <section class="panel band" id="b5" aria-live="polite"></section>
  </main>

  <section class="devs" aria-label="기기로 데이터 보내기">
    <div class="panel dev" id="d-s21"></div>
    <div class="panel dev" id="d-s26"></div>
    <div class="panel scen" id="scenPanel">
      <button id="scenBtn">시연 흐름 자동 재생</button>
      <small>연습 모드 전용</small>
    </div>
  </section>
</div>

<aside class="drawer" id="drawer" aria-label="정답과 예측 비교">
  <button class="wing" id="drTab" aria-controls="drawer" aria-expanded="false" aria-label="정답 비교 열기/닫기">
    <span class="w-a" aria-hidden="true">‹</span><span class="w-t">정답 비교</span></button>
  <div class="dr-body">
  <div class="dr-head"><h3>정답 비교</h3></div>
  <p class="dr-note" id="drNote">정답: 라벨 공식의 점유율 축(40/55/75%). 예측: 모델이 그 순간 낸 판정(화면의 3연속 확정 전 값).</p>
  <div id="drBands"></div>
  <div class="dr-legend"><span><i style="background:var(--l0)"></i>정상</span><span><i style="background:var(--l1)"></i>경고</span>
    <span><i style="background:var(--l2)"></i>혼잡</span><span><i style="background:var(--l3)"></i>심각</span><span>· 위 띠=정답, 아래 띠=예측, 최근 90초</span></div>
  </div>
</aside>

<script>
const LV = [
  { word:'여유로워요',          desc:'영상도 통화도 문제없이 잘 돼요.' },
  { word:'조금 붐비기 시작했어요', desc:'아직 괜찮지만 조금 느려질 수 있어요.' },
  { word:'많이 붐벼요',          desc:'영상이 멈추거나 통화 소리가 늦게 들릴 수 있어요.' },
  { word:'거의 막혔어요',        desc:'영상과 통화가 끊기는 상태예요.' },
];
const NAMES = ['정상', '경고', '혼잡', '심각'];
const levelOf = s => s < .25 ? 0 : s < .5 ? 1 : s < .75 ? 2 : 3;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const TICK = 0.5, WINDOW_S = 90;

// 대역별 가짜 점수 모델 (리허설 실측 근사). load = 이 대역에 붙은 폰들의 합계 Mbps
const BANDS = {
  '24': { title:'2.4GHz', sub:'ch 1 · 40MHz · 기존 공유기 대역', base:.10, k:.0096, el:null, score:.08, hist:[], shown:0, streak:[], sw:false, quiet:0 },
  '5':  { title:'5GHz',   sub:'ch 36 · 40MHz · 옮겨 갈 대역',   base:.03, k:.0034, el:null, score:.04, hist:[], shown:0, streak:[], sw:false, quiet:0 },
};
const PHONES = { s21:{ name:'S21', band:'24', rate:0 }, s26:{ name:'S26', band:'24', rate:0 } };
let clock = 0, scen = null;

function bandHTML(key){
  const b = BANDS[key];
  return `
    <div class="b-head"><div class="b-name"><b>${b.title}</b><span>${b.sub}</span></div>
      <div class="b-cnt">폰 <b class="cnt">0</b>대</div></div>
    <div class="b-state">
      <p class="lead">지금 이 대역은</p>
      <h2 class="word">여유로워요</h2>
      <p class="desc">영상도 통화도 문제없이 잘 돼요.</p>
      <div class="pills">
        <span class="pill alert"><i class="ic-b i-swap" aria-hidden="true"></i>다른 대역으로 옮겨야 해요</span>
        <span class="pill ok">옮겨 온 기기도 여유롭게 쓰는 중</span>
      </div>
    </div>
    <div class="chart"><canvas role="img" aria-label="${b.title} 최근 혼잡 점수"></canvas></div>
    <div class="b-foot">
      <div class="scale" aria-hidden="true"><div class="seg"><span></span><span></span><span></span><span></span></div>
        <div class="names"><span>정상</span><span>경고</span><span>혼잡</span><span>심각</span></div></div>
      <div class="stat"><span class="k">채널 사용</span><span class="v occ">0<small>%</small></span></div>
      <div class="stat"><span class="k">보내는 양</span><span class="v thr">0<small>M</small></span></div>
    </div>`;
}
function devHTML(id){
  const p = PHONES[id];
  return `<div class="dev-name"><i class="ic i-phone" aria-hidden="true"></i>${p.name}<span class="where"></span></div>
    <div class="rates">${[10,20,30,40].map(r => `<button class="rate" data-r="${r}" aria-pressed="false">${r}<small>M</small></button>`).join('')}</div>
    <button class="mv" title="시안: 실제로는 폰 와이파이 목록에서 직접 옮겨요"><i class="ic-b i-swap" aria-hidden="true"></i><span>5GHz로</span></button>`;
}
for (const k in BANDS){ BANDS[k].el = document.getElementById('b' + k); BANDS[k].el.innerHTML = bandHTML(k); }
for (const id in PHONES){
  const el = document.getElementById('d-' + id); el.innerHTML = devHTML(id); PHONES[id].el = el;
  el.querySelectorAll('.rate').forEach(btn => btn.onclick = () => { const r = +btn.dataset.r; PHONES[id].rate = PHONES[id].rate === r ? 0 : r; paintDevs(); });
  el.querySelector('.mv').onclick = () => { PHONES[id].band = PHONES[id].band === '24' ? '5' : '24'; PHONES[id].rate = 0; paintDevs(); };
}
function paintDevs(){
  for (const id in PHONES){
    const p = PHONES[id], el = p.el, w = el.querySelector('.where');
    w.textContent = p.band === '24' ? '2.4GHz 접속' : p.band === '5' ? '5GHz 접속' : '연결 안 됨'; w.dataset.b = p.band;
    el.querySelectorAll('.rate').forEach(b => { b.setAttribute('aria-pressed', String(+b.dataset.r === p.rate)); b.disabled = p.band === 'none'; });
    el.querySelector('.mv span').textContent = p.band === '24' ? '5GHz로' : '2.4GHz로';
  }
}

function step(){
  clock += TICK;
  for (const k in BANDS){
    const b = BANDS[k], on = Object.values(PHONES).filter(p => p.band === k);
    const load = on.reduce((a, p) => a + p.rate, 0);               // 이 대역 폰들이 보내는 양 합계 (2.4GHz 40→경고·혼잡, 60→혼잡·심각, 80→심각 / 5GHz 60→정상, 80→경고)
    const target = Math.min(1, b.base + b.k * load);
    b.score += (target - b.score) * 0.14 + (Math.random() - .5) * 0.03;
    b.score = Math.max(0, Math.min(1, b.score));
    const raw = levelOf(b.score);
    if (on.length) pushCmp(b, levelOf(Math.max(0, Math.min(1, target + (Math.random() - .5) * 0.12))), raw);
    b.streak.push(raw); if (b.streak.length > 3) b.streak.shift();
    if (b.streak.length === 3 && b.streak.every(v => v === raw)) b.shown = raw;
    // 전환 판단: 최근 3번 중 2번 심각이면 켜고, 심각 없이 30번(15초) 지나면 끈다
    const sev = b.streak.filter(v => v === 3).length;
    if (!b.sw && sev >= 2) { b.sw = true; b.quiet = 0; }
    else if (b.sw) { b.quiet = raw === 3 ? 0 : b.quiet + 1; if (b.quiet >= 30) b.sw = false; }
    b.hist.push({ t: clock, s: b.score, load: load > 0 });
    while (b.hist.length && b.hist[0].t < clock - WINDOW_S) b.hist.shift();
    b.n = on.length; b.load = load;
  }
  paint();
}
function paint(){
  for (const k in BANDS){
    const b = BANDS[k], el = b.el;
    el.dataset.lv = b.shown; el.dataset.idle = b.n ? '0' : '1';
    el.dataset.switch = k === '24' && b.sw ? '1' : '0';
    el.dataset.after = k === '5' && b.n > 0 && b.load > 0 && b.shown <= 1 ? '1' : '0';
    el.querySelector('.cnt').textContent = SIM ? b.n : Object.values(PHONES).filter(p => p.band === k).length;   // 화면엔 폰만 센다
    const wait = !SIM && b.msg && b.n > 0;   // 기기는 있는데 창(12폴링)을 채우는 중이거나 서버가 끊긴 상태
    el.querySelector('.word').textContent = !b.n ? '접속한 기기가 없어요' : wait ? '측정 준비 중' : LV[b.shown].word;
    el.querySelector('.desc').textContent = !b.n ? (b.msg && b.ok === false ? b.msg : '이 대역으로 기기를 옮기면 바로 보여요.') : wait ? b.msg : LV[b.shown].desc;
    if (wait) el.dataset.idle = '1';
    el.querySelectorAll('.seg span').forEach((s, i) => s.classList.toggle('on', b.n > 0 && i === b.shown));
    el.querySelectorAll('.names span').forEach((s, i) => s.classList.toggle('on', b.n > 0 && i === b.shown));
    el.querySelector('.occ').innerHTML = `${b.n ? Math.round(SIM ? b.score * 90 : b.occ) : 0}<small>%</small>`;
    el.querySelector('.thr').innerHTML = `${b.load}<small>M</small>`;
    drawChart(b);
  }
  document.body.dataset.move = BANDS['24'].sw ? '1' : '0';
}
function drawChart(b){
  const cv = b.el.querySelector('canvas'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const font = css('--font'), ink = css('--ink'), ink3 = css('--ink-3'), lv = [css('--l0'), css('--l1'), css('--l2'), css('--l3')];
  ctx.font = `700 12px ${font}`;
  const labW = Math.ceil(Math.max(...NAMES.map(n => ctx.measureText(n).width))) + 10;
  const L = labW, R = 4, T = 4, B = 4, w = W - L - R, h = H - T - B;
  const y = v => T + h * (1 - v), x = t => L + w * (1 - (clock - t) / WINDOW_S);
  [0, .25, .5, .75].forEach((v, i) => {
    ctx.fillStyle = lv[i]; ctx.globalAlpha = .1; ctx.fillRect(L, y(v + .25), w, h * .25); ctx.globalAlpha = 1;
    ctx.fillStyle = b.n && i === b.shown ? ink : ink3; ctx.font = `${b.n && i === b.shown ? 800 : 600} 12px ${font}`;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillText(NAMES[i], 0, y(v + .125));
  });
  ctx.fillStyle = ink; ctx.globalAlpha = .07;
  for (let i = 1; i < b.hist.length; i++) if (b.hist[i].load) ctx.fillRect(x(b.hist[i - 1].t), T, x(b.hist[i].t) - x(b.hist[i - 1].t) + .5, h);
  ctx.globalAlpha = 1;
  if (b.hist.length > 1 && b.n + b.hist.some(p => p.load) > 0){
    ctx.strokeStyle = ink; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
    let pen = false;
    b.hist.forEach(p => { if (p.s == null){ pen = false; return; } pen ? ctx.lineTo(x(p.t), y(p.s)) : ctx.moveTo(x(p.t), y(p.s)); pen = true; });
    ctx.stroke();
  }
}

// 시연 흐름 자동 재생: 2.4GHz에서 폰당 30M → 심각·경보 → 폰 둘 다 5GHz로 → 같은 30M → 여유
document.getElementById('scenBtn').onclick = () => {
  if (scen) { scen.forEach(clearTimeout); scen = null; }
  for (const id in PHONES){ PHONES[id].band = '24'; PHONES[id].rate = 0; } paintDevs();
  const at = (s, f) => setTimeout(() => { f(); paintDevs(); }, s * 1000);
  scen = [
    at(3,  () => { PHONES.s21.rate = 30; PHONES.s26.rate = 30; }),
    at(25, () => { PHONES.s21.band = '5'; PHONES.s21.rate = 0; }),
    at(28, () => { PHONES.s26.band = '5'; PHONES.s26.rate = 0; }),
    at(32, () => { PHONES.s21.rate = 30; PHONES.s26.rate = 30; }),
    at(60, () => { PHONES.s21.rate = 0; PHONES.s26.rate = 0; }),
  ];
};

document.getElementById('themeBtn').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; paint();
};
/* ---------------- 정답 비교 서랍 ---------------- */
const CMP_WIN = 60;   // "최근" 일치율 구간(초)
function drawerHTML(){
  return ['24', '5'].map(k => `
    <div class="dr-band" id="dr${k}">
      <div class="dr-top"><b>${BANDS[k].title}</b><span class="dr-acc"><span class="acc">—</span><small>최근 ${CMP_WIN}초 일치</small></span></div>
      <div class="dr-sub"><span>누적 <b class="cum">—</b></span><span>비교한 순간 <b class="cnt2">0</b></span><span>한 단계 차이까지 <b class="near">—</b></span></div>
      <div class="strip"><span>정답</span><canvas class="st-t"></canvas></div>
      <div class="strip"><span>예측</span><canvas class="st-p"></canvas></div>
      <div class="dr-err"></div>
    </div>`).join('');
}
document.getElementById('drBands').innerHTML = drawerHTML();
for (const k in BANDS){ BANDS[k].cmp = []; BANDS[k].cum = { n: 0, ok: 0, near: 0 }; BANDS[k].truthSrc = 'occupancy'; }
function pushCmp(b, truth, pred){
  if (truth == null || pred == null) return;
  b.cmp.push({ t: now2(), truth, pred });
  b.cum.n++; if (truth === pred) b.cum.ok++; if (Math.abs(truth - pred) <= 1) b.cum.near++;
}
const now2 = () => performance.now() / 1000;
function paintDrawer(){
  if (document.body.dataset.drawer !== '1') return;
  const lv = [css('--l0'), css('--l1'), css('--l2'), css('--l3')], t = now2();
  for (const k in BANDS){
    const b = BANDS[k], el = document.getElementById('dr' + k);
    while (b.cmp.length && b.cmp[0].t < t - 90) b.cmp.shift();
    const rec = b.cmp.filter(c => c.t >= t - CMP_WIN);
    const pct = (a, n) => n ? `${Math.round(a / n * 100)}%` : '—';
    el.querySelector('.acc').textContent = pct(rec.filter(c => c.truth === c.pred).length, rec.length);
    el.querySelector('.cum').textContent = pct(b.cum.ok, b.cum.n);
    el.querySelector('.near').textContent = pct(b.cum.near, b.cum.n);
    el.querySelector('.cnt2').textContent = b.cum.n;
    const errs = {}; rec.forEach(c => { if (c.truth !== c.pred){ const key = `${NAMES[c.truth]}→${NAMES[c.pred]}`; errs[key] = (errs[key] || 0) + 1; } });
    const top = Object.entries(errs).sort((a, b2) => b2[1] - a[1]).slice(0, 2);
    el.querySelector('.dr-err').textContent = !rec.length ? (b.n ? '측정 준비 중이에요.' : '이 대역에 기기가 없어요.')
      : top.length ? `틀린 순간: ${top.map(([e, n]) => `정답 ${e.replace('→', ' → 예측 ')} ${n}번`).join(', ')}` : '최근 구간은 모두 맞았어요.';
    for (const [sel, key] of [['.st-t', 'truth'], ['.st-p', 'pred']]){
      const cv = el.querySelector(sel), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
      if (!W || !H) continue;
      if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = css('--line'); ctx.fillRect(0, 0, W, H);
      const x = tt => W * (1 - (t - tt) / 90);
      b.cmp.forEach((c, i) => {
        const nx = i + 1 < b.cmp.length ? x(b.cmp[i + 1].t) : W;
        ctx.fillStyle = lv[c[key]]; ctx.fillRect(x(c.t), 0, Math.max(1, nx - x(c.t)) + .5, H);
      });
    }
  }
  const srcs = Object.values(BANDS).map(b => b.truthSrc), src = srcs.includes('probe') ? 'probe' : srcs.includes('csv') ? 'csv' : 'occupancy';
  document.getElementById('drNote').textContent = src === 'csv'
    ? '재생 모드 — 정답: 수집할 때 victim 프로브로 잰 실측 라벨. 예측: 모델이 그 순간 낸 판정(화면의 3연속 확정 전 값).'
    : src === 'probe'
    ? '정답: victim 프로브 실측(학습 라벨과 같은 정의). 예측: 모델이 그 순간 낸 판정(화면의 3연속 확정 전 값).'
    : '정답: 라벨 공식의 점유율 축(40/55/75%) — 업링크 시연에선 심각이 거의 점유율 때문이라 실측에 가까워요. 예측: 모델이 그 순간 낸 판정(화면의 3연속 확정 전 값).';
}
const drTab = document.getElementById('drTab');
const setDrawer = on => { document.body.dataset.drawer = on ? '1' : '0'; drTab.setAttribute('aria-expanded', String(on)); paintDrawer(); };
drTab.onclick = () => setDrawer(document.body.dataset.drawer !== '1');
addEventListener('keydown', e => { if (e.key === 'Escape') setDrawer(false); });
setInterval(paintDrawer, 500);
if (location.hash.includes('drawer')) setDrawer(true);

/* ---------------- 실시간 모드 ---------------- */
const SIM = location.protocol === 'file:' || location.hash.startsWith('#sim') || location.hash.startsWith('#auto');
const chip = document.getElementById('modeChip');
const qs = new URLSearchParams(location.search);
const SRV = SIM ? {} : {
  '24': qs.get('p24') ? `${location.protocol}//${location.hostname}:${qs.get('p24')}` : location.origin,
  '5':  `${location.protocol}//${location.hostname}:${qs.get('p5') || 8001}`,
};
const LOAD_S = 60;
const now = () => performance.now() / 1000;
/* 모델 확률 → 점수 (demo.html과 같은 방식): 고른 단계 구간 안에서 위·아래 단계 확률로 위치를 정한다 */
function scoreOf(probs, lv){
  const up = probs.slice(lv + 1).reduce((a, b) => a + b, 0), down = probs.slice(0, lv).reduce((a, b) => a + b, 0);
  return Math.max(0, Math.min(1, (lv + 0.5 + 0.5 * (up - down)) / 4));
}
const rateNum = r => (r && r !== 'off') ? parseInt(r, 10) : 0;
function connectBand(k){
  const b = BANDS[k]; b.n = 0; b.load = 0; b.occ = 0; b.msg = '서버에 연결하는 중';
  const es = new EventSource(SRV[k] + '/events');
  es.onerror = () => { b.ok = false; b.n = 0; b.msg = `${b.title} 서버 연결이 끊겼어요 · 다시 연결 중`; paintChip(); };
  es.onmessage = ev => {
    const st = JSON.parse(ev.data); b.ok = true;
    if (st.load) b.srvLoad = st.load;
    for (const id in PHONES) if (PHONES[id].band === k && b.srvLoad) PHONES[id].rate = rateNum((b.srvLoad[id] || {}).rate);
    b.load = Object.values(PHONES).filter(p => p.band === k).reduce((a, p) => a + p.rate, 0);
    if (!st.ready){
      b.n = st.clients || 0; b.msg = st.msg || '준비 중'; b.sw = false;   // b.n = 대역 전체 접속 수(노트북 포함, 상태 표시 여부용)
      b.hist.push({ t: now(), s: null, load: false });
      paintDevs(); paintChip(); return;
    }
    b.msg = ''; b.n = st.clients || 0; b.sw = !!st.switch_active;
    b.occ = (st.features || {}).channel_occupancy_percent || 0;
    const raw = st.raw_label; b.score = scoreOf(st.probs, raw);
    if (st.truth_src) b.truthSrc = st.truth_src;
    pushCmp(b, st.truth, raw);
    b.streak.push(raw); if (b.streak.length > 3) b.streak.shift();
    if (b.streak.length === 3 && b.streak.every(v => v === raw)) b.shown = raw;
    b.hist.push({ t: now(), s: b.score, load: b.load > 0 });
    paintDevs(); paintChip();
  };
}
let checking = false;
async function locatePhones(){
  if (checking) return; checking = true;
  try {
    const res = {};
    await Promise.all(Object.keys(SRV).map(async k => {
      try { res[k] = await (await fetch(SRV[k] + '/check', { cache: 'no-store' })).json(); } catch (e) { res[k] = null; }
    }));
    for (const id in PHONES){
      const p = PHONES[id], on = Object.keys(SRV).filter(k => res[k] && res[k][id]);
      const nb = on.length === 1 ? on[0] : on.length > 1 ? p.band : 'none';
      if (nb !== p.band){ p.band = nb; p.rate = nb !== 'none' && BANDS[nb].srvLoad ? rateNum((BANDS[nb].srvLoad[id] || {}).rate) : 0; }
    }
    paintDevs();
  } finally { checking = false; }
}
async function sendLoad(id, r){
  const p = PHONES[id]; if (p.band === 'none') return;
  const rate = p.rate === r ? 'off' : `${r}M`;
  p.rate = rate === 'off' ? 0 : r; paintDevs();
  const body = { phone: id, rate, packet_size: 1400 }; if (rate !== 'off') body.duration_s = LOAD_S;
  try {
    const j = await (await fetch(SRV[p.band] + '/load', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
    if (!j.ok){ p.rate = 0; paintDevs(); chip.textContent = `부하 실패: ${j.error || id}`; }
  } catch (e) { p.rate = 0; paintDevs(); chip.textContent = `부하 명령 실패 (${id})`; }
}
function paintChip(){
  if (SIM) return;
  const bad = Object.values(BANDS).filter(b => b.ok === false);
  chip.textContent = bad.length ? bad.map(b => b.msg).join(' · ') : `실시간 · 2.4GHz :${SRV['24'].split(':').pop()} / 5GHz :${SRV['5'].split(':').pop()}`;
}

if (SIM){
  chip.textContent = '연습 모드 · 가짜 데이터';
  paintDevs(); setInterval(step, TICK * 1000); step();
  if (location.hash.startsWith('#auto')) document.getElementById('scenBtn').click();
} else {
  document.body.dataset.live = '1';
  document.getElementById('scenPanel').innerHTML = '<span class="hint">폰이 붙은 대역은 자동으로 찾아요.<br>옮길 땐 폰 와이파이 목록에서<br>5G 이름을 눌러 주세요.</span>';
  for (const id in PHONES){
    PHONES[id].band = 'none';
    PHONES[id].el.querySelectorAll('.rate').forEach(btn => btn.onclick = () => sendLoad(id, +btn.dataset.r));
  }
  for (const k in BANDS) connectBand(k);
  locatePhones(); setInterval(locatePhones, 4000);
  setInterval(() => {
    clock = now();
    for (const k in BANDS){ const b = BANDS[k]; while (b.hist.length && b.hist[0].t < clock - WINDOW_S) b.hist.shift(); }
    paint();
  }, 500);
  paintDevs();
}
addEventListener('resize', paint);
</script>
</body>
